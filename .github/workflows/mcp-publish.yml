name: Publish MCP Registry
on:
  workflow_dispatch:
  push:
    paths:
      - server.json
      - .github/workflows/mcp-publish.yml
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install and publish
        run: |
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest
          "$HOME/go/bin/mcp-publisher" login github-oidc
          "$HOME/go/bin/mcp-publisher" publish
