name: Publish MCP Registry
on:
  workflow_dispatch:
  push:
    paths:
      - server.json
      - .github/workflows/mcp-publish.yml
permissions:
  id-token: write
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install and publish
        env:
          GOPATH: ${{ runner.temp }}/go
          GOBIN: ${{ runner.temp }}/go/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/modelcontextprotocol/registry/cmd/publisher@latest
          ls -la "$GOBIN"
          "$GOBIN/publisher" login github-oidc
          "$GOBIN/publisher" publish
